# Render Blueprint: dịch vụ web miễn phí chạy backend FastAPI (Admin tại /, trang bán hàng tại /store)
services:
  - type: web
    name: omnicare-ai-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://codex.fosta.app/v1
      - key: LLM_MODEL
        value: gpt-6-luna
      - key: LLM_FALLBACK_MODELS
        value: gpt-6.2-astra
      - key: LLM_TIMEOUT
        value: "25"
      - key: LLM_PRIMARY_TIMEOUT
        value: "10"
      - key: MODEL_CALLS_PER_DAY
        value: "40"
      - key: TRACE_DB
        value: /tmp/omnicare_traces.db
      - key: ADMIN_USERS_FILE
        value: /tmp/admin_users.json
      - key: LLM_API_KEY      # khóa model: Render hỏi khi tạo dịch vụ, không nằm trong code
        sync: false
      - key: ADMIN_PASSWORD   # mật khẩu Admin cho link công khai (bỏ trống = admin123 / 123456)
        sync: false
