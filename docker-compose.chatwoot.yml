# Chatwoot (helpdesk đa kênh) + OmniCare (AI Agent Bot) chạy cùng nhau ở máy local.
# Hướng dẫn chi tiết: docs/chatwoot_setup.md
#
#   1) cp .env.chatwoot.example .env.chatwoot   (rồi đổi SECRET_KEY_BASE, mật khẩu Postgres)
#   2) docker compose -f docker-compose.chatwoot.yml run --rm rails bundle exec rails db:chatwoot_prepare
#   3) docker compose -f docker-compose.chatwoot.yml up -d
#   4) Mở Chatwoot: http://localhost:3000   ·   OmniCare: http://localhost:8000

x-chatwoot-base: &chatwoot-base
  image: chatwoot/chatwoot:latest
  env_file: .env.chatwoot
  volumes:
    - chatwoot_storage:/app/storage
  depends_on:
    - postgres
    - redis

services:
  rails:
    <<: *chatwoot-base
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  sidekiq:
    <<: *chatwoot-base
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot_local_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD:-chatwoot_redis_pw}\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-chatwoot_redis_pw}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  omnicare:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      # Chatwoot gọi trong mạng docker qua tên service "rails"
      - CHATWOOT_URL=http://rails:3000
      - CHATWOOT_API_TOKEN=${CHATWOOT_BOT_TOKEN:-}
    restart: unless-stopped

volumes:
  chatwoot_storage:
  postgres_data:
  redis_data:
