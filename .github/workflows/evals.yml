name: OmniCare CI & Evals Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests (pytest)
        run: pytest tests/test_omnicare.py -q
      - name: Run Evals Suite + LLM-as-a-Judge Gate (>= 95%)
        run: python -m evals.run_evals --threshold 0.95
